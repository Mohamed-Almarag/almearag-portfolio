pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: "*.{js,mjs,ts,tsx}"
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    - name: format
      glob: "*.{js,mjs,ts,tsx,json,css,md,yml,yaml}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
